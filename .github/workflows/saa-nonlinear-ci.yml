name: SAA nonlinear qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saa-nonlinear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saa-nonlinear:
    name: SAA-7 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Compile nonlinear algebra
        run: |
          python -m py_compile \
            ourd/egcf/algebra/jet.py \
            ourd/egcf/algebra/nonlinear_search.py \
            tests/test_saa_nonlinear.py

      - name: Run SAA-7 qualification
        run: |
          python -m unittest \
            tests.test_saa_canonical_representative \
            tests.test_saa_nonlinear \
            -v
