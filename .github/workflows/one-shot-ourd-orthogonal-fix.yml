name: One-shot OURD orthogonal definition migration

on:
  push:
    branches:
      - fix/ourd-orthogonal-expansion

permissions:
  contents: write

concurrency:
  group: ourd-orthogonal-definition-migration
  cancel-in-progress: false

jobs:
  correct-definition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/ourd-orthogonal-expansion
          fetch-depth: 0

      - name: Install documentation runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Correct canonical OURD sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          source_paths = (
              root / "docs" / "ACRONYM_GLOSSARY.md",
              root / "docs" / "tutorial" / "04_OURD.md",
              root / "tools" / "build_docs_site.py",
              root / "tools" / "docs_concept_catalog.py",
              root / "tools" / "docs_learning_catalog.py",
          )

          replacements = (
              (
                  "Object Unique Relational Decomposition",
                  "Orthogonal Unique Relational Decomposition",
              ),
              (
                  "Decomposes a problem into unique objects and the relations between them.",
                  "Decomposes a problem into orthogonal, uniquely identified relational components and the relations between them.",
              ),
              (
                  "Decomposes a problem into unique objects and the relations between them",
                  "Decomposes a problem into orthogonal, uniquely identified relational components and the relations between them",
              ),
              (
                  "A canonical relational decomposition into unique objects, their relations, dependencies, boundaries, exclusions, and unresolved relations.",
                  "A canonical decomposition into orthogonal, uniquely identified relational components, together with their relations, dependencies, boundaries, exclusions, and unresolved relations.",
              ),
              (
                  "A canonical decomposition of the problem territory into unique objects and their relationships, dependencies, boundaries, exclusions, and unresolved relations.",
                  "A canonical decomposition of the problem territory into orthogonal, uniquely identified relational components and their relationships, dependencies, boundaries, exclusions, and unresolved relations.",
              ),
              (
                  "OURD decomposes the problem into unique objects, relations, dependencies, boundaries, exclusions, and unknowns.",
                  "OURD decomposes the problem into orthogonal, uniquely identified components while preserving their relations, dependencies, boundaries, exclusions, and unknowns.",
              ),
              (
                  "OURD builds the relational map of the problem: objects, boundaries, dependencies, goals, impacts, exclusions, and unresolved relations.",
                  "OURD decomposes the problem into orthogonal, uniquely identified relational components, boundaries, dependencies, goals, impacts, exclusions, and unresolved relations.",
              ),
              (
                  "A canonical relational decomposition of the problem territory into unique objects and their relationships, dependencies, boundaries, exclusions, and unresolved relations.",
                  "A canonical decomposition of the problem territory into orthogonal, uniquely identified relational components and their relationships, dependencies, boundaries, exclusions, and unresolved relations.",
              ),
          )

          changed = []
          for path in source_paths:
              if not path.is_file():
                  raise SystemExit(f"missing canonical source: {path}")
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.relative_to(root).as_posix())

          registry_text = (root / "tools" / "docs_learning_catalog.py").read_text(encoding="utf-8")
          required = 'AcronymRecord("OURD", "Orthogonal Unique Relational Decomposition"'
          if required not in registry_text:
              raise SystemExit(f"canonical registry correction missing: {required}")

          glossary_text = (root / "docs" / "ACRONYM_GLOSSARY.md").read_text(encoding="utf-8")
          if "**Orthogonal Unique Relational Decomposition**" not in glossary_text:
              raise SystemExit("glossary correction missing")

          print("Corrected canonical sources:")
          for item in changed:
              print(f"  {item}")
          PY

          cat > tests/test_canonical_acronyms.py <<'PYTEST'
          """Regression tests for repository-owned acronym expansions."""

          from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]


          class CanonicalAcronymTests(unittest.TestCase):
              def test_registry_uses_owner_declared_expansions(self) -> None:
                  text = (ROOT / "tools" / "docs_learning_catalog.py").read_text(encoding="utf-8")
                  self.assertIn('AcronymRecord("STM", "State Transition Machine"', text)
                  self.assertIn('AcronymRecord("OURD", "Orthogonal Unique Relational Decomposition"', text)
                  self.assertNotIn("Object Unique Relational Decomposition", text)
                  self.assertNotIn("Object-Universe-Relation-Dependency", text)

              def test_reader_glossary_matches_registry(self) -> None:
                  text = (ROOT / "docs" / "ACRONYM_GLOSSARY.md").read_text(encoding="utf-8")
                  self.assertIn("State Transition Machine", text)
                  self.assertIn("Orthogonal Unique Relational Decomposition", text)
                  self.assertNotIn("Object Unique Relational Decomposition", text)
                  self.assertNotIn("Object-Universe-Relation-Dependency", text)


          if __name__ == "__main__":
              unittest.main()
          PYTEST

          python3 -m py_compile tools/docs_learning_catalog.py tools/docs_concept_catalog.py tools/build_docs_site.py tests/test_canonical_acronyms.py
          python3 -m unittest tests.test_canonical_acronyms

      - name: Regenerate documentation from corrected sources
        shell: bash
        run: |
          python3 tools/build_docs_site.py --date 2026-08-31
          python3 - <<'PY'
          from pathlib import Path

          forbidden = (
              "Object Unique Relational Decomposition",
              "Object-Universe-Relation-Dependency",
          )
          roots = (
              Path("docs"),
              Path("tools/docs_learning_catalog.py"),
              Path("tools/docs_concept_catalog.py"),
              Path("tools/build_docs_site.py"),
          )
          stale = []
          for root in roots:
              paths = root.rglob("*") if root.is_dir() else (root,)
              for path in paths:
                  if not path.is_file() or path.suffix.lower() not in {".html", ".json", ".md", ".py", ".svg"}:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for phrase in forbidden:
                      if phrase in text:
                          stale.append(f"{path}: {phrase}")
          if stale:
              raise SystemExit("stale OURD definitions remain:\n" + "\n".join(stale))
          PY
          python3 -m unittest tests.test_canonical_acronyms
          git diff --check

      - name: Commit corrected definitions and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-ourd-orthogonal-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct OURD canonical expansion to Orthogonal"
          git push origin HEAD:fix/ourd-orthogonal-expansion
