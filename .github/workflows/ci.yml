name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compatibility-tests:
    name: Compatibility / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=10.0.0'

      - name: Run bounded core and visual compatibility suite
        run: |
          python -m unittest \
            tests.test_authority \
            tests.test_cli \
            tests.test_hypotheses \
            tests.test_loop_control \
            tests.test_production_agent \
            tests.test_saa_ir \
            tests.test_saa_normalization \
            tests.test_saa_dynamics \
            tests.test_saa_mimo \
            tests.test_saa_representative \
            tests.test_saa_semantic \
            tests.test_saa_canonical_representative \
            tests.test_saa_canonical_store \
            tests.test_oiec \
            tests.test_policy \
            tests.test_provider \
            tests.gui.test_visual_assets \
            tests.gui.test_visual_models \
            tests.gui.test_mesh_formats \
            tests.gui.test_opengl_mesh_compile \
            -v

  gui-smoke:
    name: Tk GUI smoke + fast GUI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils python3-tk

      - name: Install visual dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Pillow>=10.0.0'

      - name: Compile Python sources
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path

          excluded = {'.git', '.ourd-agent', '.venv', 'venv', 'build', 'dist', '__pycache__'}
          files = [
              path for path in Path('.').rglob('*.py')
              if not any(part in excluded or part.endswith('.egg-info') for part in path.parts)
          ]
          for path in sorted(files):
              py_compile.compile(str(path), doraise=True)
          print(f'compiled {len(files)} Python files')
          PY

      - name: Verify Tk availability
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run fast GUI contracts under Xvfb
        run: |
          xvfb-run -a python -m unittest \
            tests.gui.test_app \
            tests.gui.test_events \
            tests.gui.test_state \
            tests.gui.test_visual_assets \
            tests.gui.test_visual_models \
            tests.gui.test_mesh_formats \
            tests.gui.test_visual_similarity \
            -v

      - name: Smoke-build workbench
        run: |
          tmpdir="$(mktemp -d)"
          printf '# CI GUI fixture\n' > "$tmpdir/README.md"
          xvfb-run -a python -m ourd_gui --repo "$tmpdir" --smoke-test

  build-wheel:
    name: PEP 517 wheel build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel using repository backend
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: oiec-stm-agent-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  opengl-headless:
    name: Headless OpenGL 3.3 / EGL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OURD_GL_BACKEND: egl
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Mesa EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri mesa-utils

      - name: Install OpenGL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'moderngl[headless]>=5.12.0,<6' 'Pillow>=10.0.0'

      - name: Run OpenGL compiler and renderer tests
        run: |
          python -m unittest \
            tests.gui.test_opengl_mesh_compile \
            tests.gui.test_opengl_renderer_optional \
            -v

      - name: Require EGL context and render real pixels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from ourd_gui.mesh_formats import MeshData, MeshFace
          from ourd_gui.opengl.math3d import RenderCamera
          from ourd_gui.opengl.renderer import OpenGLRenderer

          mesh = MeshData(
              name="ci-triangle",
              vertices=(
                  (-0.8, 0.0, -0.8),
                  (0.8, 0.0, -0.8),
                  (0.0, 0.0, 0.8),
              ),
              edges=((0, 1), (1, 2), (0, 2)),
              faces=(MeshFace((0, 1, 2)),),
              format_name="ci",
              encoding="generated",
          )

          renderer = OpenGLRenderer(backend="egl")
          try:
              capabilities = renderer.capabilities()
              print(capabilities.to_dict())
              assert capabilities.version_code >= 330, capabilities

              frame = renderer.render(
                  mesh,
                  cache_key="ci-triangle",
                  mode="silhouette",
                  width=256,
                  height=256,
                  camera=RenderCamera(view="front", ortho_scale=1.2),
                  background=(0.0, 0.0, 0.0, 1.0),
              )
              assert len(frame.rgba) == 256 * 256 * 4
              pixels = {
                  frame.rgba[index : index + 4]
                  for index in range(0, len(frame.rgba), 4)
              }
              assert len(pixels) >= 2, "rendered framebuffer is uniform"

              png = frame.to_png_bytes()
              assert png.startswith(b"\x89PNG\r\n\x1a\n")
              Path("opengl-smoke.png").write_bytes(png)
          finally:
              renderer.close()
          PY

      - name: Upload OpenGL smoke capture
        uses: actions/upload-artifact@v7
        with:
          name: opengl-smoke
          path: opengl-smoke.png
          if-no-files-found: error
          retention-days: 14
