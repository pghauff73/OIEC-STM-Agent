name: SAA improvement scheduling CLI qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saa-improvement-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  improvement-cli:
    name: SAA-12.4 CLI / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Compile improvement CLI
        run: |
          python -m py_compile \
            ourd/cli.py \
            ourd/improvement_cli.py \
            ourd/egcf/algebra/improvement_scheduling.py \
            tests/test_saa_improvement_cli.py

      - name: Verify CLI help dispatch
        run: |
          python -m ourd.cli improvement --help
          python -m ourd.cli improvement schedule --help

      - name: Run improvement CLI qualification suite
        run: |
          python -m unittest tests.test_saa_improvement_cli -v
