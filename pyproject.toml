[project]
name = "oiec-stm-agent"
version = "0.7.0"
description = "A deterministic governed coding agent using OIEC-STM, OIEC-SR, OURD, IURM, EON, and CFEL"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
visual = ["Pillow>=10.0.0"]
opengl = ["moderngl[headless]>=5.12.0,<6", "Pillow>=10.0.0"]
formal-writing-pdf = ["PyMuPDF>=1.24.0"]
formal-writing-ocr = ["PyMuPDF>=1.24.0", "Pillow>=10.0.0", "pytesseract>=0.3.10"]
formal-writing-citations = []
formal-writing-semantic = []

[project.scripts]
oiec-stm-agent = "ourd.cli:main"
oiec-stm-sr-agent-icpi = "ourd_gui.app:main"
oiec-stm-sr-AgentICPI = "ourd_gui.app:main"
oiec-stm-gui = "ourd_gui.app:main"
ourd-agent = "ourd.cli:main"
egcf = "ourd.egcf.cli:main"
ourd-gui = "ourd_gui.app:main"
oiec-stm-formal-write = "ourd.formal_writing_cli:main"
oiec-stm-formal-writing-gui = "ourd_gui.formal_writing_gui:main"

[build-system]
requires = []
build-backend = "tools.build_backend"
backend-path = ["."]
