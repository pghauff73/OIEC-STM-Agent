<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img">
<title>OIEC-STM documentation relational topology</title><desc>Interactive map of category, folder, document, heading, and concept objects connected to the documentation root.</desc>
<style>svg{background:#170326;font-family:'Courier New',monospace}.grid{stroke:#4b117a;stroke-width:1}.topology-edge{fill:none;stroke:#b65cff;stroke-width:4;stroke-dasharray:10 10;animation:signal 2.2s linear infinite}.topology-kind{cursor:pointer;outline:none}.topology-kind rect{transition:160ms ease;filter:drop-shadow(7px 7px 0 #4b117a)}.topology-kind:hover rect,.topology-kind:focus rect,.topology-kind.active rect{stroke:#39e7ff;filter:drop-shadow(7px 7px 0 #ff2fc3)}.root-core rect{fill:#ffffff;stroke:#39e7ff;stroke-width:5;filter:drop-shadow(10px 10px 0 #ff2fc3)}@keyframes signal{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.topology-edge{animation:none}}</style>
<defs><pattern id="topology-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path class="grid" d="M24 0H0V24" fill="none" /></pattern></defs><rect width="100%" height="100%" fill="url(#topology-grid)" />
<g><path class="topology-edge" d="M 560 320 L 275 175" /><path class="topology-edge" d="M 560 320 L 625 132" /><path class="topology-edge" d="M 560 320 L 970 205" /><path class="topology-edge" d="M 560 320 L 910 515" /><path class="topology-edge" d="M 560 320 L 330 525" /></g><g class="root-core"><rect x="410" y="250" width="300" height="140" /><text x="560" y="300" text-anchor="middle" fill="#2a0648" font-size="22" font-weight="700">OIEC-STM OBJECT BUS</text><text x="560" y="332" text-anchor="middle" fill="#6a1aa5" font-size="13">563 INVARIANT OBJECTS</text><text x="560" y="362" text-anchor="middle" fill="#ff2fc3" font-size="11">SELECT A KIND TO FILTER</text></g><g><g class="topology-kind" data-relational-kind="category" tabindex="0" role="button" aria-label="Filter to category objects"><rect x="155" y="115" width="240" height="120" fill="#ffffff" stroke="#4b117a" stroke-width="4" /><rect x="171" y="133" width="48" height="48" fill="#4b117a" stroke="#ff2fc3" stroke-width="3" /><text x="195" y="164" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CT</text><text x="233" y="157" fill="#2a0648" font-size="15" font-weight="700">CATEGORY</text><text x="233" y="180" fill="#6a1aa5" font-size="12">006 OBJECTS</text><path d="M 173 203 H 375" stroke="#ff2fc3" stroke-width="3" stroke-dasharray="8 6" /><title>6 category relational objects</title></g><g class="topology-kind" data-relational-kind="folder" tabindex="0" role="button" aria-label="Filter to folder objects"><rect x="505" y="72" width="240" height="120" fill="#ffffff" stroke="#6a1aa5" stroke-width="4" /><rect x="521" y="90" width="48" height="48" fill="#6a1aa5" stroke="#fff36a" stroke-width="3" /><text x="545" y="121" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">FD</text><text x="583" y="114" fill="#2a0648" font-size="15" font-weight="700">FOLDER</text><text x="583" y="137" fill="#6a1aa5" font-size="12">001 OBJECTS</text><path d="M 523 160 H 725" stroke="#fff36a" stroke-width="3" stroke-dasharray="8 6" /><title>1 folder relational objects</title></g><g class="topology-kind" data-relational-kind="document" tabindex="0" role="button" aria-label="Filter to document objects"><rect x="850" y="145" width="240" height="120" fill="#ffffff" stroke="#7c2bc0" stroke-width="4" /><rect x="866" y="163" width="48" height="48" fill="#7c2bc0" stroke="#54f0a8" stroke-width="3" /><text x="890" y="194" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">DC</text><text x="928" y="187" fill="#2a0648" font-size="15" font-weight="700">DOCUMENT</text><text x="928" y="210" fill="#6a1aa5" font-size="12">030 OBJECTS</text><path d="M 868 233 H 1070" stroke="#54f0a8" stroke-width="3" stroke-dasharray="8 6" /><title>30 document relational objects</title></g><g class="topology-kind" data-relational-kind="heading" tabindex="0" role="button" aria-label="Filter to heading objects"><rect x="790" y="455" width="240" height="120" fill="#ffffff" stroke="#9a3bd6" stroke-width="4" /><rect x="806" y="473" width="48" height="48" fill="#9a3bd6" stroke="#ffffff" stroke-width="3" /><text x="830" y="504" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">HD</text><text x="868" y="497" fill="#2a0648" font-size="15" font-weight="700">HEADING</text><text x="868" y="520" fill="#6a1aa5" font-size="12">251 OBJECTS</text><path d="M 808 543 H 1010" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" /><title>251 heading relational objects</title></g><g class="topology-kind" data-relational-kind="concept" tabindex="0" role="button" aria-label="Filter to concept objects"><rect x="210" y="465" width="240" height="120" fill="#ffffff" stroke="#38115d" stroke-width="4" /><rect x="226" y="483" width="48" height="48" fill="#38115d" stroke="#d4a9ff" stroke-width="3" /><text x="250" y="514" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CP</text><text x="288" y="507" fill="#2a0648" font-size="15" font-weight="700">CONCEPT</text><text x="288" y="530" fill="#6a1aa5" font-size="12">274 OBJECTS</text><path d="M 228 553 H 430" stroke="#d4a9ff" stroke-width="3" stroke-dasharray="8 6" /><title>274 concept relational objects</title></g></g>
</svg>
