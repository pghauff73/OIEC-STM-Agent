  .node-title { fill:#2b0a5a; font-size:15px; font-weight:700; }
  .node-meta { fill:#6e3aa8; font-size:11px; letter-spacing:1px; }
  @keyframes flow { to { stroke-dashoffset:-32; } }
</style>
