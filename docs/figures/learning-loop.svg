<svg xmlns="http://www.w3.org/2000/svg" data-visual-grammar="1" data-visual-role="learning-loop" width="720" height="700" viewBox="0 0 720 700" role="img">
<title>A careful work loop</title><desc>A request moves through understanding, retrieval, bounded action, checking, and learning.</desc>
<style>svg{background:#fbfdff;font-family:system-ui,sans-serif}.learning-node{outline:none;cursor:pointer}.learning-node rect{fill:#fff;stroke:#24425f;stroke-width:3}.learning-node text{fill:#13283b;font-size:20px;font-weight:700}.role-authority rect{fill:#eef8ff;stroke:#176a9a}.role-gate rect{fill:#fff8dc;stroke:#9b6b00}.role-canonical rect{fill:#effcf3;stroke:#237a43;stroke-width:6}.learning-node:focus rect,.learning-node:hover rect{stroke:#b11f72}.learning-edge{fill:none;stroke:#24425f;stroke-width:4;marker-end:url(#arrow)}@media(prefers-reduced-motion:no-preference){.learning-edge{stroke-dasharray:8 7;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#24425f"/></marker></defs>
<g><path class="learning-edge" d="M360 117 V 153" data-relation="next-stage" data-verification="verified" aria-hidden="true" /><path class="learning-edge" d="M360 225 V 261" data-relation="next-stage" data-verification="verified" aria-hidden="true" /><path class="learning-edge" d="M360 333 V 369" data-relation="next-stage" data-verification="verified" aria-hidden="true" /><path class="learning-edge" d="M360 441 V 477" data-relation="next-stage" data-verification="verified" aria-hidden="true" /><path class="learning-edge" d="M360 549 V 585" data-relation="next-stage" data-verification="verified" aria-hidden="true" /></g><g><g class="learning-node role-concept" data-doc-node="ask" data-node-role="concept" aria-label="You ask for work" tabindex="0"><rect x="135" y="45" width="450" height="72" rx="18" /><text x="360" y="88" text-anchor="middle">You ask for work</text></g><g class="learning-node role-process" data-doc-node="understand" data-node-role="process" aria-label="Understand it" tabindex="0"><rect x="135" y="153" width="450" height="72" rx="18" /><text x="360" y="196" text-anchor="middle">Understand it</text></g><g class="learning-node role-process" data-doc-node="known" data-node-role="process" aria-label="Find what is already known" tabindex="0"><rect x="135" y="261" width="450" height="72" rx="18" /><text x="360" y="304" text-anchor="middle">Find what is already known</text></g><g class="learning-node role-authority" data-doc-node="safe" data-node-role="authority" aria-label="Try safely" tabindex="0"><rect x="135" y="369" width="450" height="72" rx="18" /><text x="360" y="412" text-anchor="middle">Try safely</text></g><g class="learning-node role-gate" data-doc-node="check" data-node-role="gate" aria-label="Check the result" tabindex="0"><rect x="135" y="477" width="450" height="72" rx="18" /><text x="360" y="520" text-anchor="middle">Check the result</text></g><g class="learning-node role-canonical" data-doc-node="remember" data-node-role="canonical" aria-label="Remember what was learned" tabindex="0"><rect x="135" y="585" width="450" height="72" rx="18" /><text x="360" y="628" text-anchor="middle">Remember what was learned</text></g></g></svg>
